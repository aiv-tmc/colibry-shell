# ColibryShell compositor configuration.
#
# Search order: /etc/colibry/colibry.toml, then
# ~/.config/colibry/colibry.toml, then ./colibry.toml (repo checkout).
# Later files override earlier ones; unknown keys are ignored.

# Wallpaper rendered by the compositor itself.
[wallpaper]
path = ""            # empty = probe assets/ and the install prefix
fit = "cover"        # "cover" fills the screen, "fit" shows the whole image

# Pointer: size and speed are applied exactly as written here.
[cursor]
size = 24            # sprite size in pixels (8..96)
speed = 0.6          # linear multiplier, 1.0 = raw deltas
acceleration = 0.4   # 0 = off, up to 2.0; boosts fast flicks
color = ""           # "" = white arrow, "#RRGGBB" tints the fill

# Focus model.
[input]
follow_mouse = 1     # 1 = focus follows the pointer, 0 = click to focus

# Programs used by default binds and the autostart terminal.
[shell]
terminal = ""        # empty = ghostty, then foot, kitty, alacritty, xterm

# Soft shadow under every window.
[shadow]
enabled = 1
offset_x = 0
offset_y = 12
radius = 24          # blur radius in pixels
rounding = 8         # silhouette corner rounding
opacity = 0.45       # 0.0 .. 1.0

# Server-side titlebar.
[titlebar]
height = 32
button_width = 46
font = ""            # empty = first available system font

# Corners: content bottom, titlebar top and shadow share this radius.
[window]
rounding = 10

# Rounded screen corners (pure black, untouchable arcs).
[screen]
rounding = 12        # 0 disables the mask

# Startup: fade-in from black and the input grace period.
[login]
fade_ms = 2500       # desktop brightening length
unlock_ms = 250      # input stays locked this long after start

# HDR10 metadata on HDR-capable panels.
[hdr]
enabled = 1          # 1 = attach metadata when the panel reports HDR

[render]
dmabuf = -1

# Monitor rules: "name,resolution,scale"; empty name matches every output.
monitors = []

# Extra binds on top of the defaults: "MOD+KEY=action".
bind = []
